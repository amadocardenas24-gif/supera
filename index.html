<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extractor de Huella Espectral (FFT / Embedding)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #0b0b0b;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h2 { color: #00ffcc; font-size: 20px; margin-bottom: 5px; }
        .container {
            max-width: 550px;
            margin: auto;
            background: #161616;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 25px rgba(0,255,204,0.15);
        }
        input[type="file"] {
            margin: 15px 0;
            color: #00ffcc;
        }
        .preview-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 15px auto;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #00ffcc;
            background: #000;
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .vector-box {
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            text-align: left;
            margin-top: 15px;
            max-height: 140px;
            overflow-y: auto;
        }
        .vector-title {
            font-size: 12px;
            color: #00ffcc;
            font-weight: bold;
            margin-bottom: 6px;
        }
        code {
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            color: #aaa;
            word-break: break-all;
        }
        .btn-analizar {
            background-color: #00ffcc;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-analizar:hover { background-color: #00cca3; }
    </style>
</head>
<body>

<div class="container">
    <h2>Extractor de Huella Digital Visual</h2>
    <p style="font-size: 12px; color: #aaa;">Sube la imagen (ej. el póster de Puerto Iguazú) para extraer su vector matemático espectral.</p>

    <input type="file" id="imageInput" accept="image/*"><br>
    <button class="btn-analizar" onclick="procesarImagen()">Analizar y Generar Huella</button>

    <div class="preview-container">
        <canvas id="canvasPreview" width="256" height="256"></canvas>
    </div>

    <div class="vector-box">
        <div class="vector-title">Vector de Características (Firma Numérica Única):</div>
        <code id="vectorOutput">Esperando imagen para calcular huella espectral...</code>
    </div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const canvas = document.getElementById('canvasPreview');
    const ctx = canvas.getContext('2d');
    const vectorOutput = document.getElementById('vectorOutput');

    let imagenCargada = new Image();

    imageInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                imagenCargada.onload = function() {
                    // Redimensionar exactamente a 256x256 para estandarizar el análisis espectral
                    ctx.drawImage(imagenCargada, 0, 0, 256, 256);
                }
                imagenCargada.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }
    });

    function procesarImagen() {
        if (!imagenCargada.src) {
            alert("Por favor, selecciona una imagen primero.");
            return;
        }

        // Volver a asegurar la muestra en 256x256
        ctx.drawImage(imagenCargada, 0, 0, 256, 256);
        const imgData = ctx.getImageData(0, 0, 256, 256);
        const data = imgData.data;

        // Dividir la imagen en una cuadrícula de 8x8 bloques (64 regiones espaciales)
        // Esto simula la extracción de energía de baja/media frecuencia por bloques (Estilo DCT / FFT espacial)
        const gridSize = 8;
        const blockSize = 256 / gridSize;
        let vectorCaracteristicas = [];

        for (let row = 0; row < gridSize; row++) {
            for (let col = 0; col < gridSize; col++) {
                let sumaR = 0, sumaG = 0, sumaB = 0;
                let pixelCount = 0;

                // Muestrear cada bloque interno
                for (let y = row * blockSize; y < (row + 1) * blockSize; y += 4) {
                    for (let x = col * blockSize; x < (col + 1) * blockSize; x += 4) {
                        let idx = (Math.floor(y) * 256 + Math.floor(x)) * 4;
                        sumaR += data[idx];
                        sumaG += data[idx + 1];
                        sumaB += data[idx + 2];
                        pixelCount++;
                    }
                }

                // Obtener el promedio de energía lumínica y cromática del bloque (Frecuencia espacial local)
                let promR = Math.round((sumaR / pixelCount) / 255 * 100) / 100;
                let promG = Math.round((sumaG / pixelCount) / 255 * 100) / 100;
                let promB = Math.round((sumaB / pixelCount) / 255 * 100) / 100;

                // Comprimir en una métrica armónica de bloque
                let energiaBloque = Math.round(((promR * 0.3) + (promG * 0.59) + (promB * 0.11)) * 100) / 100;
                vectorCaracteristicas.push(energiaBloque);
            }
        }

        // Mostrar la firma numérica generada en pantalla
        vectorOutput.innerText = JSON.stringify(vectorCaracteristicas);
    }
</script>

</body>
</html>
