<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner Fractal AR Continuo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h2 { color: #4CAF50; }
        .container {
            max-width: 600px;
            margin: auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
        }
        /* Contenedor para alinear video y canvas de realidad aumentada */
        .view-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 10px auto;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #4CAF50;
        }
        video, canvas {
            width: 100%;
            display: block;
        }
        #status {
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Escáner Fractal en Vivo (AR)</h2>
    <p id="instrucciones">Apunta la cámara al patrón fractal. Buscando...</p>
    
    <div class="view-container">
        <!-- Video en vivo continuo -->
        <video id="video" autoplay playsinline></video>
        <!-- Canvas oculto para procesar los fotogramas en segundo plano -->
        <canvas id="processingCanvas" style="display:none;"></canvas>
    </div>

    <div id="status" style="color: #ffcc00;">⏳ Buscando patrón...</div>
</div>

<script>
    const video = document.getElementById('video');
    const processingCanvas = document.getElementById('processingCanvas');
    const statusDiv = document.getElementById('status');
    const instrucciones = document.getElementById('instrucciones');

    let scanning = true;
    let scanInterval;

    // Iniciar la cámara trasera del celular de forma continua
    async function iniciarCamara() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' }
            });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                processingCanvas.width = video.videoWidth;
                processingCanvas.height = video.videoHeight;
                // Iniciar bucle de escaneo continuo cada 200ms (fluido y sin bloquear)
                scanInterval = setInterval(escanearFotograma, 200);
            };
        } catch (err) {
            alert("Error al acceder a la cámara: " + err);
        }
    }

    iniciarCamara();

    function escanearFotograma() {
        if (!scanning) return;

        const ctx = processingCanvas.getContext('2d');
        const w = processingCanvas.width;
        const h = processingCanvas.height;

        // Dibujar el fotograma actual del video en el canvas de procesamiento
        ctx.drawImage(video, 0, 0, w, h);
        
        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;

        let centroX = w / 2;
        let centroY = h / 2;
        let radioCentral = Math.min(w, h) * 0.18; // Ajustado al hueco central de tu fractal
        const distanciaBase = radioCentral + 30;

        const angulos = [0, 45, 90, 135, 180, 225, 270, 315];
        let firmaSecuencia = [];

        angulos.forEach(angulo => {
            const rad = angulosToRad(angulo);
            const x = Math.floor(centroX + distanciaBase * Math.cos(rad));
            const y = Math.floor(centroY + distanciaBase * Math.sin(rad));

            if (x >= 0 && x < w && y >= 0 && y < h) {
                const index = (y * w + x) * 4;
                const r = data[index];
                const g = data[index + 1];
                const b = data[index + 2];
                firmaSecuencia.push(clasificarColor(r, g, b));
            } else {
                firmaSecuencia.push("X");
            }
        });

        // Validar si el patrón corresponde al fractal (debe tener una mezcla rica de colores V, A, R y un centro claro)
        const coloresValidos = firmaSecuencia.filter(c => c !== 'X').length;
        
        // Verificamos que el centro tenga la zona blanca/clara característica del fractal
        const centroIndex = (Math.floor(centroY) * w + Math.floor(centroX)) * 4;
        const esCentroClaro = data[centroIndex] > 150 && data[centroIndex+1] > 150 && data[centroIndex+2] > 150;

        // Criterio de reconocimiento estricto para tu diseño fractal
        if (coloresValidos >= 6 && esCentroClaro) {
            // ¡ENCONTRADO! Detenemos el escaneo continuo
            scanning = false;
            clearInterval(scanInterval);
            
            // Detener el streaming de video para fijar la imagen detectada
            const stream = video.srcObject;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            mostrarRealidadAumentada(ctx, centroX, centroY, radioCentral, firmaSecuencia);
        }
    }

    function mostrarRealidadAumentada(ctx, centroX, centroY, radioCentral, firmaSecuencia) {
        instrucciones.innerText = "¡Patrón Fractal Reconocido con Éxito!";
        statusDiv.style.color = "#00ffcc";
        statusDiv.innerText = "ID: INF-NODE-" + firmaSecuencia.join("");

        // Ocultar el elemento de video en vivo y mostrar el canvas congelado con la AR
        video.style.display = "none";
        processingCanvas.style.display = "block";

        // Dibujar el ancla central verde
        ctx.strokeStyle = "#00ff00";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(centroX, centroY, radioCentral, 0, 2 * Math.PI);
        ctx.stroke();

        // Cargar y superponer la FOTO CUADRADA en el centro
        const fotoOverlay = new Image();
        fotoOverlay.src = 'https://picsum.photos/300'; // Puedes cambiar este enlace por tu propia foto cuadrada o logo
        fotoOverlay.onload = () => {
            const tamañoFoto = radioCentral * 1.8;
            const xPos = centroX - tamañoFoto / 2;
            const yPos = centroY - tamañoFoto / 2;

            // Superponer la foto cuadrada
            ctx.drawImage(fotoOverlay, xPos, yPos, tamañoFoto, tamañoFoto);

            // Marco elegante alrededor de la foto
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 4;
            ctx.strokeRect(xPos, yPos, tamañoFoto, tamañoFoto);
        };
    }

    function angulosToRad(deg) {
        return deg * Math.PI / 180;
    }

    function clasificarColor(r, g, b) {
        // Zona blanca central o iluminación fuerte
        if (r > 200 && g > 200 && b > 200) return "X";
        
        // Clasificación de tonos del fractal
        if (g > r * 0.85 && g > b) {
            return "V"; // Verde
        } else if (b > r * 0.75 && b > g) {
            return "A"; // Azul
        } else if (r > g && r > b) {
            return "R"; // Rojo
        }
        return "X";
    }
</script>

</body>
</html>
