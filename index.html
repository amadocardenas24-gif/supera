<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner AR Dual - Reconocimiento Fractal Universal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #0b0b0b;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h2 { color: #00ffcc; }
        .container {
            max-width: 600px;
            margin: auto;
            background: #161616;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,255,204,0.2);
        }
        .view-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 10px auto;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #00ffcc;
        }
        video, canvas {
            width: 100%;
            display: block;
        }
        #status {
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            word-break: break-all;
        }
        #gpsSection {
            margin-top: 15px;
            padding: 12px;
            background: #222;
            border-radius: 8px;
            display: none;
            border: 1px solid #444;
        }
        #gpsBtn {
            background-color: #00ffcc;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        #gpsBtn:hover { background-color: #00cca3; }
        #gpsStatus {
            font-size: 14px;
            color: #aaaaaa;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Escáner AR Dual (Alfa / Beta)</h2>
    <p id="instrucciones">Apunta la cámara a cualquiera de los dos fractales descargados.</p>
    
    <div class="view-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="processingCanvas" style="display:none;"></canvas>
    </div>

    <div id="status" style="color: #ffaa00;">⏳ Analizando texturas en vivo...</div>
    
    <div id="gpsSection">
        <p style="margin: 0; color: #fff; font-size: 14px;">¡Patrón validado! Pulsa para autorizar tu ubicación:</p>
        <button id="gpsBtn" onclick="obtenerGPS()">📍 Autorizar y Registrar GPS</button>
        <div id="gpsStatus">Esperando autorización del usuario...</div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const processingCanvas = document.getElementById('processingCanvas');
    const statusDiv = document.getElementById('status');
    const gpsSection = document.getElementById('gpsSection');
    const gpsStatusDiv = document.getElementById('gpsStatus');
    const instrucciones = document.getElementById('instrucciones');

    let scanning = true;
    let scanInterval;

    async function iniciarCamara() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' }
            });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                processingCanvas.width = video.videoWidth;
                processingCanvas.height = video.videoHeight;
                scanInterval = setInterval(escanearPatronesDual, 200);
            };
        } catch (err) {
            alert("Error al acceder a la cámara: " + err);
        }
    }

    iniciarCamara();

    function escanearPatronesDual() {
        if (!scanning) return;

        const ctx = processingCanvas.getContext('2d');
        const w = processingCanvas.width;
        const h = processingCanvas.height;

        ctx.drawImage(video, 0, 0, w, h);
        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;

        let totalPuntos = 0;
        let cRojo = 0, cVerde = 0, cAzul = 0;
        let cAmarillo = 0, cMagenta = 0, cCian = 0;

        const filas = 8, columnas = 8;
        const pasoX = Math.floor(w / (columnas + 1));
        const pasoY = Math.floor(h / (filas + 1));

        for (let f = 1; f <= filas; f++) {
            for (let c = 1; c <= columnas; c++) {
                let x = c * pasoX;
                let y = f * pasoY;
                let index = (y * w + x) * 4;

                let r = data[index];
                let g = data[index + 1];
                let b = data[index + 2];

                // Contabilizar huella de Fractal Alfa
                if (r > g * 1.5 && r > b * 1.5) cRojo++;
                else if (g > r * 1.2 && g > b) cVerde++;
                else if (b > r * 1.2 && b > g) cAzul++;

                // Contabilizar huella de Fractal Beta
                if (r > 180 && g > 180 && b < 100) cAmarillo++;
                else if (r > 150 && g < 100 && b > 150) cMagenta++;
                else if (r < 100 && g > 150 && b > 150) cCian++;

                totalPuntos++;
            }
        }

        let pAlfa = (cRojo + cVerde + cAzul) / totalPuntos;
        let pBeta = (cAmarillo + cMagenta + cCian) / totalPuntos;

        if (pAlfa > 0.35) {
            finalizarEscaneo(ctx, w, h, "¡Fractal Alfa (Clásico) Detectado!");
        } else if (pBeta > 0.35) {
            finalizarEscaneo(ctx, w, h, "¡Fractal Beta (Variante) Detectado!");
        }
    }

    function finalizarEscaneo(ctx, w, h, mensajeExito) {
        scanning = false;
        clearInterval(scanInterval);

        const stream = video.srcObject;
        if (stream) stream.getTracks().forEach(track => track.stop());

        instrucciones.innerText = mensajeExito;
        statusDiv.style.color = "#00ffcc";
        statusDiv.innerText = "Firma geométrica validada correctamente.";

        gpsSection.style.display = "block";
        video.style.display = "none";
        processingCanvas.style.display = "block";

        let centroX = w / 2;
        let centroY = h / 2;
        let tamañoFoto = Math.min(w, h) * 0.45;

        // Superponer foto en Realidad Aumentada
        const fotoOverlay = new Image();
        fotoOverlay.src = 'https://picsum.photos/300'; // Puedes reemplazar con tu enlace de foto final
        fotoOverlay.onload = () => {
            const xPos = centroX - tamañoFoto / 2;
            const yPos = centroY - tamañoFoto / 2;

            ctx.drawImage(fotoOverlay, xPos, yPos, tamañoFoto, tamañoFoto);

            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 6;
            ctx.strokeRect(xPos, yPos, tamañoFoto, tamañoFoto);
        };
    }

    function obtenerGPS() {
        if ("geolocation" in navigator) {
            gpsStatusDiv.style.color = "#ffaa00";
            gpsStatusDiv.innerText = "🛰️ Conectando con los satélites GPS...";
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude.toFixed(6);
                    const lon = position.coords.longitude.toFixed(6);
                    gpsStatusDiv.style.color = "#00ffcc";
                    gpsStatusDiv.innerText = `📍 Ubicación Registrada: Lat ${lat}, Lon ${lon}`;
                },
                (error) => {
                    gpsStatusDiv.style.color = "#ff4d4d";
                    gpsStatusDiv.innerText = "❌ Permiso denegado o señal GPS no disponible.";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        } else {
            gpsStatusDiv.style.color = "#ff4d4d";
            gpsStatusDiv.innerText = "❌ Tu navegador no soporta geolocalización.";
        }
    }
</script>

</body>
</html>
