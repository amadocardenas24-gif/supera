<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner de Patrón Fractal Áureo - Alta Precisión</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h2 { color: #4CAF50; }
        .container {
            max-width: 600px;
            margin: auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .view-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 10px auto;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #4CAF50;
        }
        video, canvas {
            width: 100%;
            display: block;
        }
        #status {
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Validador Fractal Multinivel</h2>
    <p id="instrucciones">Apunta la cámara al patrón fractal. Analizando en vivo...</p>
    
    <div class="view-container">
        <!-- Video en vivo continuo -->
        <video id="video" autoplay playsinline></video>
        <!-- Canvas oculto para procesamiento matemático -->
        <canvas id="processingCanvas" style="display:none;"></canvas>
    </div>

    <div id="status" style="color: #ffcc00;">⏳ Buscando firma geométrica...</div>
</div>

<script>
    const video = document.getElementById('video');
    const processingCanvas = document.getElementById('processingCanvas');
    const statusDiv = document.getElementById('status');
    const instrucciones = document.getElementById('instrucciones');

    let scanning = true;
    let scanInterval;

    async function iniciarCamara() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' }
            });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                processingCanvas.width = video.videoWidth;
                processingCanvas.height = video.videoHeight;
                // Bucle de escaneo fluido cada 200 ms
                scanInterval = setInterval(escanearFotogramaMatricial, 200);
            };
        } catch (err) {
            alert("Error al acceder a la cámara: " + err);
        }
    }

    iniciarCamara();

    function escanearFotogramaMatricial() {
        if (!scanning) return;

        const ctx = processingCanvas.getContext('2d');
        const w = processingCanvas.width;
        const h = processingCanvas.height;

        ctx.drawImage(video, 0, 0, w, h);
        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;

        let centroX = w / 2;
        let centroY = h / 2;
        let radioCentral = Math.min(w, h) * 0.18; // Estimación del núcleo central blanco

        // Validar que el centro sea una oquedad clara/blanca
        const centroIndex = (Math.floor(centroY) * w + Math.floor(centroX)) * 4;
        const esCentroClaro = data[centroIndex] > 160 && data[centroIndex+1] > 160 && data[centroIndex+2] > 160;

        if (!esCentroClaro) return; // Si no hay centro claro, descartar fotograma rápido

        // 🌟 MATRIZ MULTINIVEL (3 Anillos concéntricos × 8 Ángulos = 24 puntos de muestreo)
        const angulos = [0, 45, 90, 135, 180, 225, 270, 315];
        const multiplicadores_radio = [1.2, 1.6, 2.1]; 
        let firmaMatriz = [];

        multiplicadores_radio.forEach(mult => {
            let distancia = radioCentral * mult;
            angulos.forEach(angulo => {
                let rad = angulosToRad(angulo);
                let x = Math.floor(centroX + distancia * Math.cos(rad));
                let y = Math.floor(centroY + distancia * Math.sin(rad));

                if (x >= 0 && x < w && y >= 0 && y < h) {
                    let index = (y * w + x) * 4;
                    let r = data[index];
                    let g = data[index + 1];
                    let b = data[index + 2];
                    firmaMatriz.push(clasificarColorHSV(r, g, b));
                } else {
                    firmaMatriz.push("X");
                }
            });
        });

        // Conteo estricto de la distribución cromática del fractal
        let totalVerde = firmaMatriz.filter(c => c === 'V').length;
        let totalAzul = firmaMatriz.filter(c => c === 'A').length;
        let totalRojo = firmaMatriz.filter(c => c === 'R').length;

        // 🔒 CRITERIO DE AUTENTICIDAD ESTRICTO: Debe contener suficientes muestras de los 3 colores en los anillos
        if (totalVerde >= 3 && totalAzul >= 3 && totalRojo >= 3) {
            scanning = false;
            clearInterval(scanInterval);

            // Apagar la cámara al reconocer
            const stream = video.srcObject;
            if (stream) stream.getTracks().forEach(track => track.stop());

            activarRealidadAumentada(ctx, centroX, centroY, radioCentral, totalVerde, totalAzul, totalRojo);
        }
    }

    function activarRealidadAumentada(ctx, centroX, centroY, radioCentral, v, a, r) {
        instrucciones.innerText = "¡Patrón Fractal Áureo Autenticado con Éxito!";
        statusDiv.style.color = "#00ffcc";
        statusDiv.innerText = `Firma Verificada [V:${v} | A:${a} | R:${r}]`;

        video.style.display = "none";
        processingCanvas.style.display = "block";

        // Dibujar ancla central verde
        ctx.strokeStyle = "#00ff00";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(centroX, centroY, radioCentral, 0, 2 * Math.PI);
        ctx.stroke();

        // Superponer la FOTO CUADRADA en Realidad Aumentada
        const fotoOverlay = new Image();
        fotoOverlay.src = 'https://picsum.photos/300'; // Puedes cambiar esta URL por tu propia foto cuadrada o logotipo
        fotoOverlay.onload = () => {
            const tamañoFoto = radioCentral * 1.8;
            const xPos = centroX - tamañoFoto / 2;
            const yPos = centroY - tamañoFoto / 2;

            ctx.drawImage(fotoOverlay, xPos, yPos, tamañoFoto, tamañoFoto);

            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 4;
            ctx.strokeRect(xPos, yPos, tamañoFoto, tamañoFoto);
        };
    }

    function angulosToRad(deg) {
        return deg * Math.PI / 180;
    }

    // Conversión y clasificación cromática precisa equivalente a HSV
    function clasificarColorHSV(r, g, b) {
        let rNorm = r / 255, gNorm = g / 255, bNorm = b / 255;
        let max = Math.max(rNorm, gNorm, bNorm);
        let min = Math.min(rNorm, gNorm, bNorm);
        let diff = max - min;
        let h = 0, s = max === 0 ? 0 : diff / max, v = max;

        if (diff !== 0) {
            if (max === rNorm) h = ((gNorm - bNorm) / diff) % 6;
            else if (max === gNorm) h = (bNorm - rNorm) / diff + 2;
            else h = (rNorm - gNorm) / diff + 4;
            h = Math.round(h * 60);
            if (h < 0) h += 360;
        }

        if (s < 0.15 || v < 0.2) return "X"; // Neutros / oscuros

        if (h >= 35 && h <= 85) return "V";      // Verde
        else if (h > 85 && h < 150) return "A";  // Azul
        else if (h >= 330 || h <= 15) return "R";// Rojo
        
        return "X";
    }
</script>

</body>
</html>
