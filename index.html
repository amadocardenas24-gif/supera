<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner Fractal AR con Botón GPS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #0b0b0b;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h2 { color: #00ffcc; }
        .container {
            max-width: 600px;
            margin: auto;
            background: #161616;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,255,204,0.2);
        }
        .view-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 10px auto;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #00ffcc;
        }
        video, canvas {
            width: 100%;
            display: block;
        }
        #status {
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            word-break: break-all;
        }
        #gpsSection {
            margin-top: 15px;
            padding: 12px;
            background: #222;
            border-radius: 8px;
            display: none;
            border: 1px solid #444;
        }
        #gpsBtn {
            background-color: #00ffcc;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        #gpsBtn:hover { background-color: #00cca3; }
        #gpsStatus {
            font-size: 14px;
            color: #aaaaaa;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Escáner Fractal AR + GPS</h2>
    <p id="instrucciones">Apunta la cámara a la imagen fractal para escanear.</p>
    
    <div class="view-container">
        <!-- Video en vivo -->
        <video id="video" autoplay playsinline></video>
        <!-- Canvas para procesamiento y RA -->
        <canvas id="processingCanvas" style="display:none;"></canvas>
    </div>

    <div id="status" style="color: #ffaa00;">⏳ Buscando patrón fractal en vivo...</div>
    
    <!-- Sección del botón de autorización GPS -->
    <div id="gpsSection">
        <p style="margin: 0; color: #fff; font-size: 14px;">¡Patrón verificado con éxito! Pulsa el botón para autorizar tu ubicación:</p>
        <button id="gpsBtn" onclick="obtenerGPS()">📍 Autorizar y Registrar GPS</button>
        <div id="gpsStatus">Esperando autorización del usuario...</div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const processingCanvas = document.getElementById('processingCanvas');
    const statusDiv = document.getElementById('status');
    const gpsSection = document.getElementById('gpsSection');
    const gpsStatusDiv = document.getElementById('gpsStatus');
    const instrucciones = document.getElementById('instrucciones');

    let scanning = true;
    let scanInterval;

    async function iniciarCamara() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' }
            });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                processingCanvas.width = video.videoWidth;
                processingCanvas.height = video.videoHeight;
                scanInterval = setInterval(escanearPatronFractal, 200);
            };
        } catch (err) {
            alert("Error al acceder a la cámara: " + err);
        }
    }

    iniciarCamara();

    function escanearPatronFractal() {
        if (!scanning) return;

        const ctx = processingCanvas.getContext('2d');
        const w = processingCanvas.width;
        const h = processingCanvas.height;

        ctx.drawImage(video, 0, 0, w, h);
        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;

        let totalPuntos = 0;
        let conteoRojo = 0;
        let conteoVerde = 0;
        let conteoAzul = 0;

        const filas = 8;
        const columnas = 8;
        const pasoX = Math.floor(w / (columnas + 1));
        const pasoY = Math.floor(h / (filas + 1));

        for (let f = 1; f <= filas; f++) {
            for (let c = 1; c <= columnas; c++) {
                let x = c * pasoX;
                let y = f * pasoY;
                let index = (y * w + x) * 4;

                let r = data[index];
                let g = data[index + 1];
                let b = data[index + 2];

                let color = clasificarColorFractal(r, g, b);
                if (color === 'R') conteoRojo++;
                if (color === 'V') conteoVerde++;
                if (color === 'A') conteoAzul++;
                totalPuntos++;
            }
        }

        let propRojo = conteoRojo / totalPuntos;
        let propVerde = conteoVerde / totalPuntos;
        let propAzul = conteoAzul / totalPuntos;

        if (propRojo > 0.12 && propVerde > 0.12 && propAzul > 0.12) {
            scanning = false;
            clearInterval(scanInterval);

            const stream = video.srcObject;
            if (stream) stream.getTracks().forEach(track => track.stop());

            activarRealidadAumentada(ctx, w, h, propRojo, propVerde, propAzul);
        }
    }

    function clasificarColorFractal(r, g, b) {
        if (r > 200 && g > 200 && b > 200) return "X";
        if (r > g * 1.5 && r > b * 1.5) return "R";
        if (g > r * 1.2 && g > b) return "V";
        if (b > r * 1.2 && b > g) return "A";
        return "X";
    }

    function activarRealidadAumentada(ctx, w, h, r, v, a) {
        instrucciones.innerText = "¡Imagen Fractal Reconocida!";
        statusDiv.style.color = "#00ffcc";
        statusDiv.innerText = `Firma Válida [R: ${(r*100).toFixed(0)}% | V: ${(v*100).toFixed(0)}% | A: ${(a*100).toFixed(0)}%]`;

        // Mostrar la sección interactiva con el botón obligatorio de GPS
        gpsSection.style.display = "block";

        video.style.display = "none";
        processingCanvas.style.display = "block";

        let centroX = w / 2;
        let centroY = h / 2;
        let tamañoFoto = Math.min(w, h) * 0.45;

        const fotoOverlay = new Image();
        fotoOverlay.src = 'https://picsum.photos/300';
        fotoOverlay.onload = () => {
            const xPos = centroX - tamañoFoto / 2;
            const yPos = centroY - tamañoFoto / 2;

            ctx.drawImage(fotoOverlay, xPos, yPos, tamañoFoto, tamañoFoto);

            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 6;
            ctx.strokeRect(xPos, yPos, tamañoFoto, tamañoFoto);
        };
    }

    // Función que se ejecuta exclusivamente al hacer clic en el botón de autorización GPS
    function obtenerGPS() {
        if ("geolocation" in navigator) {
            gpsStatusDiv.style.color = "#ffaa00";
            gpsStatusDiv.innerText = "🛰️ Conectando con los satélites GPS...";
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude.toFixed(6);
                    const lon = position.coords.longitude.toFixed(6);
                    gpsStatusDiv.style.color = "#00ffcc";
                    gpsStatusDiv.innerText = `📍 Ubicación Registrada: Lat ${lat}, Lon ${lon}`;
                },
                (error) => {
                    gpsStatusDiv.style.color = "#ff4d4d";
                    gpsStatusDiv.innerText = "❌ Permiso denegado o señal GPS no disponible.";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        } else {
            gpsStatusDiv.style.color = "#ff4d4d";
            gpsStatusDiv.innerText = "❌ Tu navegador no soporta geolocalización.";
        }
    }
</script>

</body>
</html>
