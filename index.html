<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner Fractal Universal por Autosimilitud</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h2 { color: #4CAF50; }
        .container {
            max-width: 600px;
            margin: auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .view-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 10px auto;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #4CAF50;
        }
        video, canvas {
            width: 100%;
            display: block;
        }
        #status {
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Escáner Fractal Universal (AR)</h2>
    <p id="instrucciones">Apunta a cualquier parte del fractal. Buscando autosimilitud...</p>
    
    <div class="view-container">
        <!-- Video en vivo continuo -->
        <video id="video" autoplay playsinline></video>
        <!-- Canvas oculto para procesamiento por rejilla -->
        <canvas id="processingCanvas" style="display:none;"></canvas>
    </div>

    <div id="status" style="color: #ffcc00;">⏳ Analizando textura fractal...</div>
</div>

<script>
    const video = document.getElementById('video');
    const processingCanvas = document.getElementById('processingCanvas');
    const statusDiv = document.getElementById('status');
    const instrucciones = document.getElementById('instrucciones');

    let scanning = true;
    let scanInterval;

    async function iniciarCamara() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' }
            });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                processingCanvas.width = video.videoWidth;
                processingCanvas.height = video.videoHeight;
                // Escaneo continuo cada 200ms
                scanInterval = setInterval(escanearTexturaFractalUniversal, 200);
            };
        } catch (err) {
            alert("Error al acceder a la cámara: " + err);
        }
    }

    iniciarCamara();

    function escanearTexturaFractalUniversal() {
        if (!scanning) return;

        const ctx = processingCanvas.getContext('2d');
        const w = processingCanvas.width;
        const h = processingCanvas.height;

        ctx.drawImage(video, 0, 0, w, h);
        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;

        // 🌐 MUESTREO POR REJILLA UNIVERSAL (Grid Sampling)
        // En lugar de un solo centro, evaluamos una malla de 6x6 (36 puntos) repartidos por todo el fotograma
        let totalPuntos = 0;
        let conteoVerde = 0;
        let conteoAzul = 0;
        let conteoRojo = 0;

        const filas = 6;
        const columnas = 6;
        const pasoX = Math.floor(w / (columnas + 1));
        const pasoY = Math.floor(h / (filas + 1));

        for (let f = 1; f <= filas; f++) {
            for (let c = 1; c <= columnas; c++) {
                let x = c * pasoX;
                let y = f * pasoY;
                let index = (y * w + x) * 4;

                let r = data[index];
                let g = data[index + 1];
                let b = data[index + 2];

                let clasificacion = clasificarColorHSV(r, g, b);
                if (clasificacion === 'V') conteoVerde++;
                if (clasificacion === 'A') conteoAzul++;
                if (clasificacion === 'R') conteoRojo++;
                totalPuntos++;
            }
        }

        // 🔒 CRITERIO FRACTAL UNIVERSAL: 
        // Si el fotograma contiene una mezcla equilibrada de los tres colores (propio de la teselación fractal), 
        // sin importar qué zona específica estés enfocando, se valida el reconocimiento.
        let proporcionVerde = conteoVerde / totalPuntos;
        let proporcionAzul = conteoAzul / totalPuntos;
        let proporcionRojo = conteoRojo / totalPuntos;

        // Umbrales de tolerancia para reconocer la textura fractal en cualquier parte
        if (proporcionVerde > 0.15 && proporcionAzul > 0.15 && proporcionRojo > 0.15) {
            scanning = false;
            clearInterval(scanInterval);

            // Detener stream de video
            const stream = video.srcObject;
            if (stream) stream.getTracks().forEach(track => track.stop());

            activarRealidadAumentadaUniversal(ctx, w, h, conteoVerde, conteoAzul, conteoRojo);
        }
    }

    function activarRealidadAumentadaUniversal(ctx, w, h, v, a, r) {
        instrucciones.innerText = "¡Textura Fractal Reconocida en Cualquier Punto!";
        statusDiv.style.color = "#00ffcc";
        statusDiv.innerText = `Autosimilitud Verificada [V:${v} | A:${a} | R:${r}]`;

        video.style.display = "none";
        processingCanvas.style.display = "block";

        // Coordenadas centrales del fotograma congelado para ubicar la AR
        let centroX = w / 2;
        let centroY = h / 2;
        let tamañoFoto = Math.min(w, h) * 0.4;

        // Superponer la FOTO CUADRADA en Realidad Aumentada exactamente en el centro de la vista actual
        const fotoOverlay = new Image();
        fotoOverlay.src = 'https://picsum.photos/300'; // Puedes cambiar esta URL por tu propia foto o logotipo
        fotoOverlay.onload = () => {
            const xPos = centroX - tamañoFoto / 2;
            const yPos = centroY - tamañoFoto / 2;

            ctx.drawImage(fotoOverlay, xPos, yPos, tamañoFoto, tamañoFoto);

            // Marco holográfico de éxito
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 5;
            ctx.strokeRect(xPos, yPos, tamañoFoto, tamañoFoto);
        };
    }

    // Clasificador cromático HSV robusto frente a cambios de luz
    function clasificarColorHSV(r, g, b) {
        let rNorm = r / 255, gNorm = g / 255, bNorm = b / 255;
        let max = Math.max(rNorm, gNorm, bNorm);
        let min = Math.min(rNorm, gNorm, bNorm);
        let diff = max - min;
        let h = 0, s = max === 0 ? 0 : diff / max, v = max;

        if (diff !== 0) {
            if (max === rNorm) h = ((gNorm - bNorm) / diff) % 6;
            else if (max === gNorm) h = (bNorm - rNorm) / diff + 2;
            else h = (rNorm - gNorm) / diff + 4;
            h = Math.round(h * 60);
            if (h < 0) h += 360;
        }

        if (s < 0.15 || v < 0.2) return "X"; // Descartar neutros / oscuros

        if (h >= 35 && h <= 85) return "V";      // Verde
        else if (h > 85 && h < 150) return "A";  // Azul
        else if (h >= 330 || h <= 15) return "R";// Rojo
        
        return "X";
    }
</script>

</body>
</html>
