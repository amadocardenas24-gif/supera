<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner Continuo - Código Fractal Áureo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #0b0b0b;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h2 { color: #00ffcc; }
        .container {
            max-width: 600px;
            margin: auto;
            background: #161616;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,255,204,0.2);
        }
        .view-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 10px auto;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #00ffcc;
        }
        video, canvas {
            width: 100%;
            display: block;
        }
        #status {
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Escáner de Código Fractal Áureo</h2>
    <p id="instrucciones">Apunta la cámara a tu imagen fractal. Si coincide, se teñirá de color automáticamente.</p>
    
    <div class="view-container">
        <!-- Video en vivo continuo -->
        <video id="video" autoplay playsinline></video>
        <!-- Canvas para procesamiento en tiempo real -->
        <canvas id="processingCanvas" style="display:none;"></canvas>
    </div>

    <div id="status" style="color: #ffaa00;">⏳ Buscando el Código Fractal Áureo...</div>
</div>

<script>
    const video = document.getElementById('video');
    const processingCanvas = document.getElementById('processingCanvas');
    const statusDiv = document.getElementById('status');
    const instrucciones = document.getElementById('instrucciones');

    let scanInterval;

    async function iniciarCamara() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' }
            });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                processingCanvas.width = video.videoWidth;
                processingCanvas.height = video.videoHeight;
                // Bucle continuo de escaneo cada 150ms
                scanInterval = setInterval(escanearYValidarImagen, 150);
            };
        } catch (err) {
            alert("Error al acceder a la cámara: " + err);
        }
    }

    iniciarCamara();

    function escanearYValidarImagen() {
        const ctx = processingCanvas.processingCtx || processingCanvas.getContext('2d');
        const w = processingCanvas.width;
        const h = processingCanvas.height;

        // Dibujar el fotograma actual de la cámara
        ctx.drawImage(video, 0, 0, w, h);
        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;

        // 1. Validar la característica principal del "Código fractal aureo":
        // El gran agujero/hueco blanco circular exactamente en el centro de la imagen.
        let centroX = Math.floor(w / 2);
        let centroY = Math.floor(h / 2);
        let radioMuestra = Math.floor(Math.min(w, h) * 0.15);

        let pixelesBlancosCentro = 0;
        let totalPuntosCentro = 0;

        // Inspeccionar el núcleo central buscando la oquedad blanca característica
        for (let dy = -radioMuestra; dy <= radioMuestra; dy += 5) {
            for (let dx = -radioMuestra; dx <= radioMuestra; dx += 5) {
                let x = centroX + dx;
                let y = centroY + dy;
                if (x >= 0 && x < w && y >= 0 && y < h) {
                    let idx = (y * w + x) * 4;
                    let r = data[idx], g = data[idx+1], b = data[idx+2];
                    if (r > 180 && g > 180 && b > 180) {
                        pixelesBlancosCentro++;
                    }
                    totalPuntosCentro++;
                }
            }
        }

        let densidadCentroClaro = pixelesBlancosCentro / totalPuntosCentro;

        // 2. Validar los anillos circundantes (la teselación de colores Azul, Verde y Rojo de tu fractal)
        let conteoAzul = 0, conteoVerde = 0, conteoRojo = 0;
        let totalAnillo = 0;
        let radioAnillo = radioMuestra * 1.8;

        for (let ang = 0; ang < 360; ang += 30) {
            let rad = ang * Math.PI / 180;
            let x = Math.floor(centroX + radioAnillo * Math.cos(rad));
            let y = Math.floor(centroY + radioAnillo * Math.sin(rad));

            if (x >= 0 && x < w && y >= 0 && y < h) {
                let idx = (y * w + x) * 4;
                let r = data[idx], g = data[idx+1], b = data[idx+2];

                if (b > r && b > g * 0.8) conteoAzul++;
                else if (g > r && g > b) conteoVerde++;
                else if (r > g && r > b) conteoRojo++;
                totalAnillo++;
            }
        }

        // Criterio estricto de coincidencia con el "Código fractal aureo"
        let esElFractalVerdadero = (densidadCentroClaro > 0.4) && 
                                    (conteoAzul >= 2 && conteoVerde >= 2 && conteoRojo >= 2);

        if (esElFractalVerdadero) {
            // ¡ACERTÓ! Mostramos el canvas procesado y aplicamos SOLO un color translúcido encima (tinte verde de éxito)
            video.style.display = "none";
            processingCanvas.style.display = "block";

            // Tinte de color verde translúcido sobre toda la imagen para marcar el acierto
            ctx.fillStyle = "rgba(0, 255, 100, 0.35)";
            ctx.fillRect(0, 0, w, h);

            // Borde indicador de éxito
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 8;
            ctx.strokeRect(0, 0, w, h);

            instrucciones.innerText = "¡Código Fractal Áureo Reconocido con Éxito!";
            statusDiv.style.color = "#00ffcc";
            statusDiv.innerText = "✔ Coincidencia exacta detectada.";
        } else {
            // SI NO LO RECONOCE: Se asegura de seguir mostrando el video en vivo y continúa buscando
            video.style.display = "block";
            processingCanvas.style.display = "none";

            instrucciones.innerText = "Apunta la cámara a tu imagen fractal. Si coincide, se teñirá de color automáticamente.";
            statusDiv.style.color = "#ffaa00";
            statusDiv.innerText = "⏳ Buscando el Código Fractal Áureo... (Continúa buscando)";
        }
    }
</script>

</body>
</html>
