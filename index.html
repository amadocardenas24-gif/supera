<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner de Patrón Fractal Generado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #0b0b0b;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h2 { color: #00ffcc; }
        .container {
            max-width: 600px;
            margin: auto;
            background: #161616;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,255,204,0.2);
        }
        .view-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 10px auto;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #00ffcc;
        }
        video, canvas {
            width: 100%;
            display: block;
        }
        #status {
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Escáner Fractal AR (Definitivo)</h2>
    <p id="instrucciones">Apunta la cámara del celular a la imagen fractal que descargaste.</p>
    
    <div class="view-container">
        <!-- Video en vivo de la cámara trasera -->
        <video id="video" autoplay playsinline></video>
        <!-- Canvas oculto para procesar los colores del fractal -->
        <canvas id="processingCanvas" style="display:none;"></canvas>
    </div>

    <div id="status" style="color: #ffaa00;">⏳ Buscando patrón fractal en vivo...</div>
</div>

<script>
    const video = document.getElementById('video');
    const processingCanvas = document.getElementById('processingCanvas');
    const statusDiv = document.getElementById('status');
    const instrucciones = document.getElementById('instrucciones');

    let scanning = true;
    let scanInterval;

    async function iniciarCamara() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' }
            });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                processingCanvas.width = video.videoWidth;
                processingCanvas.height = video.videoHeight;
                // Escaneo fluido cada 200 ms
                scanInterval = setInterval(escanearPatronFractal, 200);
            };
        } catch (err) {
            alert("Error al acceder a la cámara: " + err);
        }
    }

    iniciarCamara();

    function escanearPatronFractal() {
        if (!scanning) return;

        const ctx = processingCanvas.getContext('2d');
        const w = processingCanvas.width;
        const h = processingCanvas.height;

        ctx.drawImage(video, 0, 0, w, h);
        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;

        // Muestreo por rejilla de 8x8 (64 puntos distribuidos en todo el fotograma)
        let totalPuntos = 0;
        let conteoRojo = 0;
        let conteoVerde = 0;
        let conteoAzul = 0;

        const filas = 8;
        const columnas = 8;
        const pasoX = Math.floor(w / (columnas + 1));
        const pasoY = Math.floor(h / (filas + 1));

        for (let f = 1; f <= filas; f++) {
            for (let c = 1; c <= columnas; c++) {
                let x = c * pasoX;
                let y = f * pasoY;
                let index = (y * w + x) * 4;

                let r = data[index];
                let g = data[index + 1];
                let b = data[index + 2];

                let color = clasificarColorFractal(r, g, b);
                if (color === 'R') conteoRojo++;
                if (color === 'V') conteoVerde++;
                if (color === 'A') conteoAzul++;
                totalPuntos++;
            }
        }

        // Proporciones detectadas en la muestra
        let propRojo = conteoRojo / totalPuntos;
        let propVerde = conteoVerde / totalPuntos;
        let propAzul = conteoAzul / totalPuntos;

        // Criterio de validación: El fractal generado contiene una alta densidad equilibrada de los 3 colores
        if (propRojo > 0.12 && propVerde > 0.12 && propAzul > 0.12) {
            scanning = false;
            clearInterval(scanInterval);

            // Detener la cámara al reconocer con éxito
            const stream = video.srcObject;
            if (stream) stream.getTracks().forEach(track => track.stop());

            activarRealidadAumentada(ctx, w, h, propRojo, propVerde, propAzul);
        }
    }

    // Clasificador afinado a la paleta exacta del generador fractal
    function clasificarColorFractal(r, g, b) {
        if (r > 200 && g > 200 && b > 200) return "X"; // Zona clara / fondo neutro

        if (r > g * 1.5 && r > b * 1.5) return "R"; // Rojo predominante
        if (g > r * 1.2 && g > b) return "V";       // Verde predominante
        if (b > r * 1.2 && b > g) return "A";       // Azul predominante

        return "X";
    }

    function activarRealidadAumentada(ctx, w, h, r, v, a) {
        instrucciones.innerText = "¡Imagen Fractal Reconocida con Éxito!";
        statusDiv.style.color = "#00ffcc";
        statusDiv.innerText = `Firma Válida [R: ${(r*100).toFixed(0)}% | V: ${(v*100).toFixed(0)}% | A: ${(a*100).toFixed(0)}%]`;

        video.style.display = "none";
        processingCanvas.style.display = "block";

        let centroX = w / 2;
        let centroY = h / 2;
        let tamañoFoto = Math.min(w, h) * 0.45;

        // Superponer la FOTO CUADRADA en Realidad Aumentada
        const fotoOverlay = new Image();
        fotoOverlay.src = 'https://picsum.photos/300'; // Puedes cambiar esta URL por tu foto o logotipo final
        fotoOverlay.onload = () => {
            const xPos = centroX - tamañoFoto / 2;
            const yPos = centroY - tamañoFoto / 2;

            ctx.drawImage(fotoOverlay, xPos, yPos, tamañoFoto, tamañoFoto);

            // Marco holográfico de éxito
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 6;
            ctx.strokeRect(xPos, yPos, tamañoFoto, tamañoFoto);
        };
    }
</script>

</body>
</html>
